name: 🚀 Feature Request
description: Propose a new feature, improvement, or integration for Knowledge Mining Agent.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement to Knowledge Mining Agent!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation?
      placeholder: A clear description of the challenge or problem (e.g. "I'm always frustrated when...")
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: Describe the solution you'd like to see.
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered?
      placeholder: e.g. Other libraries, workflows, or designs.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or mockups here.
